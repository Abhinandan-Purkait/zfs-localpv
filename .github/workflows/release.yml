name: Release Images and Charts

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+**'
jobs:
  pre-checks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v22
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell --pure --run "echo" ./shell.nix

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DOCKERHUB
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror multi-arch image with crane
        env:
          SRC: ghcr.io/abhinandan-purkait/dev/zfs-driver:${{ github.ref_name }}
          DH: docker.io/abhinandan15/zfs-driver:${{ github.ref_name }}
        run: |
            nix-shell --pure --run "crane copy --platform all ${{ env.SRC }} ${{ env.DH }}"

  helm:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Helm CLI
        uses: azure/setup-helm@v3

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u abhinandan-purkait --password-stdin

      - name: Pull OCI chart from GHCR
        run: |
          CHART_REF=oci://ghcr.io/abhinandan-purkait/helm/zfs-localpv
          mkdir -p charts-staged
          helm pull "$CHART_REF" \
            --version "${{ github.ref_name }}" \
            --destination charts-staged
          mkdir -p charts-final
          tar -xvf charts-staged/zfs-localpv-v2.11.0.tgz -C charts-final

      - name: Publish chart via helm-gh-pages
        uses: stefanprodan/helm-gh-pages@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: ./charts-final

