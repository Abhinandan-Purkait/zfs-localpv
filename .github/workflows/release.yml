name: Release Images and Charts

on:
  release:
    types:
      - "created"

jobs:
  copy-images-and-chart:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v22
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell --pure --run "echo" ./shell.nix

      - name: Set Image Org
        run: |
          [ -z "${{ secrets.IMAGE_ORG }}" ] && IMAGE_ORG=abhinandan-purkait || IMAGE_ORG=${{ secrets.IMAGE_ORG}}
          echo "IMAGE_ORG=${IMAGE_ORG}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Login to Quay
      #   uses: docker/login-action@v3
      #   with:
      #     registry: quay.io
      #     username: ${{ secrets.QUAY_USERNAME }}
      #     password: ${{ secrets.QUAY_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror multi-arch image with crane to Dockerhub
        env:
          SRC: ghcr.io/${{ env.IMAGE_ORG }}/dev/zfs-driver:${{ github.ref_name }}
          DH: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zfs-driver:${{ github.ref_name }}
        run: |
            nix-shell --pure --run "crane copy --platform all ${{ env.SRC }} ${{ env.DH }}" ./shell.nix

      - name: Mirror multi-arch image with crane to Github
        env:
          SRC: ghcr.io/${{ env.IMAGE_ORG }}/dev/zfs-driver:${{ github.ref_name }}
          GH: ghcr.io/${{ env.IMAGE_ORG }}/zfs-driver:${{ github.ref_name }}
        run: |
            nix-shell --pure --run "crane copy --platform all ${{ env.SRC }} ${{ env.GH }}" ./shell.nix

      # - name: Mirror multi-arch image with crane to Quay
      #   env:
      #     SRC: ghcr.io/${{ env.IMAGE_ORG }}/dev/zfs-driver:${{ github.ref_name }}
      #     QY: quay.io/${{ secrets.QUAY_USERNAME }}/zfs-driver:${{ github.ref_name }}
      #   run: |
      #       nix-shell --pure --run "crane copy --platform all ${{ env.SRC }} ${{ env.QY }}"

      - name: Log in to GHCR for Helm
        run: nix-shell --pure --run "echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ env.IMAGE_ORG }} --password-stdin" ./shell.nix

      - name: Pull OCI chart from GHCR
        run: |
          rm -rf deploy/helm/charts
          CHART_REF=oci://ghcr.io/${{ env.IMAGE_ORG }}/helm/zfs-localpv
          mkdir -p charts-staged
          helm pull "$CHART_REF" \
            --version "${{ github.ref_name }}" \
            --destination charts-staged
          mkdir -p charts-final
          mkdir -p deploy/helm/charts
          tar -xvf charts-staged/zfs-localpv-v2.11.0.tgz -C charts-final
          mv charts-final/zfs-localpv/* deploy/helm/charts

      - name: Update the registry and the repository
        run: |
          nix-shell --pure --run "./scripts/update-reg-repo.sh --registry docker.io --repository ${{ env.DOCKERHUB_USERNAME }}" ./shell.nix

      - name: Publish chart via helm-gh-pages
        uses: stefanprodan/helm-gh-pages@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: ./deploy/helm
